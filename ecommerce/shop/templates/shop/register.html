{% extends "shop/base.html" %}
{% load static %}

{% block content %}

{% include "shop/includes/errors.html" %}
<div class="container d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <img src="{% static 'shop/images/add-user.png' %}" alt="Register Icon" width="60">
                    <h3 class="mt-3 mb-0 fw-bold text-primary">Create Account</h3>
                    <p class="text-muted">Register to get started</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}

                    <div class="form-floating mb-3">
                        <input type="text" name="username" id="username" class="form-control" placeholder="Username" value="{{ form.username.value | default:'' }}">
                        <label for="username">Username</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" name="email" id="email" class="form-control" placeholder="Email" value="{{ form.email.value | default:'' }}">
                        <label for="email">Email</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" name="password" id="password" class="form-control" placeholder="Password">
                        <label for="password">Password</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirm Password">
                        <label for="confirm_password">Confirm Password</label>
                    </div>

                    <div class="form-floating mb-4">
                        <select name="user_type" id="user_type" class="form-select">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                            <option value="vendor">Vendor</option>
                        </select>
                        <label for="user_type">User Type</label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-person-plus me-2"></i> Register
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-1">Already have an account?</p>
                    <a href="{% url 'shop:login' %}" class="btn btn-outline-primary btn-sm px-4 rounded-pill">
                        Login Here
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
