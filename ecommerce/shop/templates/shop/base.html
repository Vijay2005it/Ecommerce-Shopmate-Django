<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Main Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Header styling */
        .navbar {
            background: linear-gradient(90deg, #ff7e5f, #feb47b);
        }
        .navbar-brand, .nav-link {
            color: #fff !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: #000 !important;
        }

        /* Hero section */
        .hero {
            background: url('https://images.unsplash.com/photo-1600185361772-d8b2d1561ff3?auto=format&fit=crop&w=1350&q=80') no-repeat center center;
            background-size: cover;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .hero h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 5px #000;
        }

        /* Footer */
        footer {
            background: #333;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        /* Cards */
        .product-card {
            transition: transform 0.3s;
        }
        .product-card:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

{% include "shop/includes/header.html" %}

{% block content %}

{% endblock  %}

{% include "shop/includes/footer.html" %}


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
